# ============================================================================
# Nginx — Storm Surfing Association (site Angular PRÉRENDU / statique)
# Le build (`npm run build`) génère des fichiers HTML complets par page dans
# dist/app/browser. Nginx ne sert que du statique : aucun process Node requis.
# Déposez ce fichier dans /etc/nginx/sites-available/ puis créez le symlink
# vers sites-enabled/, et adaptez le chemin `root` + les certificats SSL.
# ============================================================================

# --- HTTP -> HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name storm-surfing.fr www.storm-surfing.fr;
    return 301 https://storm-surfing.fr$request_uri;
}

# --- www -> sans-www (canonicalisation du domaine, bon pour le SEO) ---
server {
    listen 443 ssl;
    http2 on;
    server_name www.storm-surfing.fr;

    ssl_certificate     /etc/letsencrypt/live/storm-surfing.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/storm-surfing.fr/privkey.pem;

    return 301 https://storm-surfing.fr$request_uri;
}

# --- Site principal ---
server {
    listen 443 ssl;
    http2 on;
    server_name storm-surfing.fr;

    ssl_certificate     /etc/letsencrypt/live/storm-surfing.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/storm-surfing.fr/privkey.pem;

    # >>> Chemin où vous déposez le contenu de dist/app/browser/ <<<
    root /var/www/storm-surfing/browser;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml application/manifest+json;
    # Si le module brotli est installé, décommentez :
    # brotli on;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # En-têtes de sécurité (recommandés)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Fichiers JS/CSS hashés : immuables, cache 1 an
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Images & polices (non hashées) : cache 30 jours
    location ~* \.(?:jpg|jpeg|png|webp|gif|ico|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # robots.txt & sitemap.xml : cache court
    location = /robots.txt { add_header Cache-Control "public, max-age=3600"; }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }

    # HTML prérendu + repli SPA.
    # $uri/  -> sert /event/index.html pour /event (page prérendue).
    # /index.html -> repli pour toute route inconnue (routage client).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
