<main [@routeAnimations]="prepareRoute(outlet)">
  <header class="w-dvw fixed top-0 left-1/2 -translate-x-1/2 z-[1000] py-4">
    <div class="max-w-[120rem] text-gray-50 px-6 md:px-8 lg:px-10">
      <nav class="w-full flex flex-row items-center font-sans">
        <a class="text-gray-50" routerLink="/home" aria-label="Storm Surfing Association - Accueil">
          <img src="assets/logo_new.png" class="h-8 w-8" alt="Logo Storm Surfing Association" width="32" height="32">
        </a>
        <div class="flex-1 relative hidden md:flex items-center justify-center">
          <ul class="mx-auto inline-flex gap-6 text-sm font-light">
            <li><a
                class="font-bold relative after:h-px after:content-[''] after:w-full after:absolute after:top-full after:bg-accent-500 after:left-0 after:translate-y-1"
                routerLink="/home">Accueil</a></li>
            <li><a routerLink="/event">Nos Événements</a></li>
            <li><a routerLink="/join">Nous Rejoindre</a></li>
            <li><a routerLink="/archives">Archives</a></li>
            <li><a routerLink="/membres">Membres</a></li>
          </ul>
          <ul class="absolute right-0">
            <li class="relative"><a
                class=" h-9 rounded-lg flex items-center justify-center text-sm bg-accent-500 text-white leading-none px-6 uppercase"
                routerLink="/contact">Contact</a></li>
          </ul>
        </div>
  
        <!-- Bouton menu (mobile) -->
        <button type="button" (click)="toggleMenu()" aria-label="Ouvrir le menu"
                class="md:hidden ml-auto inline-flex items-center justify-center h-10 w-10 rounded-lg text-gray-50">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>
      </nav>
    </div>
  </header>

  <!-- Menu plein écran (mobile) -->
  <div *ngIf="menuOpen" class="md:hidden fixed inset-0 z-[1001] bg-black/95 backdrop-blur-sm flex flex-col">
    <div class="flex items-center justify-between px-6 py-4">
      <img src="assets/logo_new.png" class="h-8 w-8" alt="Storm Surfing Association" width="32" height="32">
      <button type="button" (click)="closeMenu()" aria-label="Fermer le menu"
              class="h-10 w-10 inline-flex items-center justify-center text-gray-50">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </div>
    <nav class="flex-1 flex flex-col items-center justify-center gap-6 text-gray-50 text-2xl font-light">
      <a routerLink="/home" (click)="closeMenu()">Accueil</a>
      <a routerLink="/event" (click)="closeMenu()">Nos Événements</a>
      <a routerLink="/join" (click)="closeMenu()">Nous Rejoindre</a>
      <a routerLink="/archives" (click)="closeMenu()">Archives</a>
      <a routerLink="/membres" (click)="closeMenu()">Membres</a>
      <a routerLink="/contact" (click)="closeMenu()"
         class="mt-2 px-8 py-2 rounded-lg bg-accent-500 text-white text-lg uppercase">Contact</a>
    </nav>
  </div>
  <router-outlet #outlet="outlet"></router-outlet>
</main>
